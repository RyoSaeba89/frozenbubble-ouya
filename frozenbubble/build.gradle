apply plugin: 'com.android.application'

// Load the release signing configuration from keystore.properties if it
// exists (the file and the keystore itself are kept out of version
// control).  Unsigned debug builds work without it.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "org.jfedor.frozenbubble"
    ndkVersion '23.2.8568313'

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile     rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
                // The OUYA runs Android 4.1 (API 16), so APK signature
                // scheme v1 (JAR signing) is required for installation.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    lintOptions {
        disable "Instantiatable"
    }

    defaultConfig {
        applicationId "org.jfedor.frozenbubble"
        compileSdk 34
        minSdkVersion 16
        targetSdkVersion 34

        ndk {
            moduleName "modplug-1.0"
            abiFilters "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets.main {
        jni.srcDirs = [] // This prevents the auto generation of Android.mk
        jniLibs.srcDir 'src/main/libs' // This is not necessary unless you have precompiled libraries in your project.
    }

    task buildNative(type: Exec, description: 'Compile JNI source via NDK') {
        def ndkDir = android.ndkDirectory
        commandLine "$ndkDir/ndk-build.cmd",
                '-C', file('src/main/jni').absolutePath, // Change src/main/jni the relative path to your jni source
                '-j', Runtime.runtime.availableProcessors(),
                'all',
                'NDK_DEBUG=1'
    }

    task cleanNative(type: Exec, description: 'Clean JNI object files') {
        def ndkDir = android.ndkDirectory
        commandLine "$ndkDir/ndk-build.cmd",
                '-C', file('src/main/jni').absolutePath, // Change src/main/jni the relative path to your jni source
                'clean'
    }

    clean.dependsOn 'cleanNative'

    tasks.withType(JavaCompile) {
        compileTask -> compileTask.dependsOn buildNative
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.1.0'
    }
}
